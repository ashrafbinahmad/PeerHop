name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23' # or your actual Go version

      - name: Install Wails
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wixtoolset --yes --no-progress

      # If your Wails project uses npm/yarn/pnpm inside ui/, add that here
      # - name: Install UI dependencies
      #   working-directory: ./ui
      #   shell: pwsh
      #   run: npm install

      - name: Build Windows GUI (Wails)
        working-directory: ./ui
        shell: pwsh
        run: |
          wails build -platform windows/amd64 -o transend.exe
          Move-Item -Path "build\bin\transend.exe" -Destination "..\transend.exe"

      - name: Build MSI Installer (WiX)
        shell: pwsh
        run: |
          # Get Version from tag (remove refs/tags/ and leading v)
          $tag = "$env:GITHUB_REF" -replace 'refs/tags/',''
          $version = $tag -replace '^v',''

          # Update Version in WXS file
          $wxsPath = "ui/build/windows/msi/transend.wxs"
          (Get-Content $wxsPath) `
            -replace 'Version="1.3.3"', "Version=""$version""" |
            Set-Content $wxsPath

          # Build MSI using WiX
          candle $wxsPath -o transend.wixobj
          light transend.wixobj -o "transend_setup.msi"

      - name: Build CLI binaries
        shell: pwsh
        run: |
          # Windows CLI
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -o transend-cli.exe cmd/transend/main.go

          # Linux CLI (optional – remove if not needed or if cross-compile fails)
          $env:GOOS = "linux"
          $env:GOARCH = "amd64"
          go build -o transend-linux cmd/transend/main.go

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            transend.exe
            transend_setup.msi
            transend-cli.exe
            transend-linux
          draft: false
          prerelease: false
          generate_release_notes: true
