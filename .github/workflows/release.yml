name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Wails
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Build Windows GUI (Wails)
        working-directory: ./ui
        shell: pwsh
        run: |
          wails build -platform windows/amd64 -nsis -o transend.exe
          Move-Item -Path "build\bin\transend.exe" -Destination "..\transend.exe"

          # Debug listing
          Get-ChildItem -Path "build\bin"

          # Find installer
          $setup = Get-ChildItem -Path "build\bin\*installer.exe" | Select-Object -First 1
          if ($setup) {
            Move-Item -Path $setup.FullName -Destination "..\transend_setup.exe"
          } else {
            Write-Error "Installer not found in build/bin"
          }

      - name: Build CLI binaries
        shell: pwsh
        run: |
          # Windows CLI
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -o transend-cli.exe cmd/transend/main.go

          # Linux CLI
          $env:GOOS = "linux"
          $env:GOARCH = "amd64"
          go build -o transend-linux cmd/transend/main.go

      - name: Create Release in transender-releases repo
        uses: softprops/action-gh-release@v2
        with:
          repository: yourusername/transender-releases
          token: ${{ secrets.RELEASE_PAT }}
          files: |
            transend.exe
            transend_setup.exe
            transend-cli.exe
            transend-linux
          draft: false
          prerelease: false
          generate_release_notes: true
