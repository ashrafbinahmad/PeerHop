name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List available build files
        shell: pwsh
        run: |
          $possibleFiles = @(
            "builds/peerhop_win.exe",
            "builds/peerhop_setup.exe",
            "builds/peerhop_setup.msi",
            "builds/peerhop_linux",
            "builds/peerhop_cli_win.exe",
            "builds/peerhop_cli_linux"
          )

          Write-Host "Available build files:"
          $foundCount = 0
          foreach ($file in $possibleFiles) {
            if (Test-Path $file) {
              Write-Host "  ✓ $file"
              $foundCount++
            } else {
              Write-Host "  - $file (not found)" -ForegroundColor Yellow
            }
          }

          Write-Host "`nFound $foundCount file(s) to upload"

      - name: Create Release in peerhop repo
        uses: softprops/action-gh-release@v2
        with:
          repository: ashrafbinahmad/peerhop
          token: ${{ secrets.RELEASE_PAT }}
          body: |
            ## Download Binaries

            Please download the pre-built binaries below:
            - **peerhop_win.exe** - Windows GUI application
            - **peerhop_setup.exe** - Windows installer
            - **peerhop_cli_win.exe** - Windows CLI tool
            - **peerhop_cli_linux** - Linux CLI tool
            - **peerhop_linux** - Linux GUI application

            > **Note:** Ignore the "Source code" archives - they are automatically added by GitHub and are not needed.
          files: |
            builds/peerhop_win.exe
            builds/peerhop_setup.exe
            builds/peerhop_setup.msi
            builds/peerhop_cli_win.exe
            builds/peerhop_cli_linux
            builds/peerhop_linux
          draft: false
          prerelease: false
          generate_release_notes: false
