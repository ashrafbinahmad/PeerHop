name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify build files exist
        shell: pwsh
        run: |
          $requiredFiles = @(
            "builds/transend_win.exe",
            "builds/transend_setup.exe",
            "builds/transend_linux",
            "builds/transend_cli_win.exe",
            "builds/transend_cli_linux"
          )
          
          $missingFiles = @()
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              $missingFiles += $file
            } else {
              Write-Host "✓ Found: $file"
            }
          }
          
          if ($missingFiles.Count -gt 0) {
            Write-Error "Missing required build files:`n$($missingFiles -join "`n")"
            exit 1
          }
          
          Write-Host "`n✓ All required build files are present!"

      - name: Create Release in transender-releases repo
        uses: softprops/action-gh-release@v2
        with:
          repository: ashrafbinahmad/transender-releases
          token: ${{ secrets.RELEASE_PAT }}
          body: |
            ## Download Binaries
            
            Please download the pre-built binaries below:
            - **transend_win.exe** - Windows GUI application
            - **transend_setup.exe** - Windows installer
            - **transend_cli_win.exe** - Windows CLI tool
            - **transend_cli_linux** - Linux CLI tool
            - **transend_linux** - Linux GUI application
            
            > **Note:** Ignore the "Source code" archives - they are automatically added by GitHub and are not needed.
          files: |
            builds/transend_win.exe
            builds/transend_setup.exe
            builds/transend_cli_win.exe
            builds/transend_cli_linux
            builds/transend_linux
          draft: false
          prerelease: false
          generate_release_notes: false
