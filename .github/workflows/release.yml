name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23' # or your actual Go version

      - name: Install Wails
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wixtoolset --yes --no-progress

      # If your Wails project uses npm/yarn/pnpm inside ui/, add that here
      # - name: Install UI dependencies
      #   working-directory: ./ui
      #   shell: pwsh
      #   run: npm install

      - name: Build Windows GUI (Wails)
        working-directory: ./ui
        shell: pwsh
        run: |
          wails build -platform windows/amd64 -nsis -o transend.exe
          Move-Item -Path "build\bin\transend.exe" -Destination "..\transend.exe"
          
          # Find installer and rename with version
          $setup = Get-ChildItem -Path "build\bin\*installer.exe" | Select-Object -First 1
          if ($setup) {
            Move-Item -Path $setup.FullName -Destination "..\transend_setup.exe"
          }

      - name: Build CLI binaries
        shell: pwsh
        run: |
          # Windows CLI
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -o transend-cli.exe cmd/transend/main.go

          # Linux CLI (optional – remove if not needed or if cross-compile fails)
          $env:GOOS = "linux"
          $env:GOARCH = "amd64"
          go build -o transend-linux cmd/transend/main.go

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            transend.exe
            transend_setup.exe
            transend-cli.exe
            transend-linux
          draft: false
          prerelease: false
          generate_release_notes: true
