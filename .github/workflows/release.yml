name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux Dependencies (for Wails deps if needed, though we cross-compile Win)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev nsis

      - name: Build Windows GUI (Wails)
        working-directory: ./ui
        run: |
          wails build -platform windows/amd64 -nsis -o transend.exe
          # Move binary
          mv build/bin/transend.exe ../transend.exe
          # Find and move installer (setup)
          mv build/bin/*installer.exe ../transend_setup.exe

      - name: Rename Installer with Version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mv transend_setup.exe transend_${VERSION}_setup.exe

      - name: Build CLI binaries
        run: |
          GOOS=windows GOARCH=amd64 go build -o transend-cli.exe cmd/transend/main.go
          GOOS=linux GOARCH=amd64 go build -o transend-linux cmd/transend/main.go

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            transend.exe
            transend_*_setup.exe
            transend-cli.exe
            transend-linux
          draft: false
          prerelease: false
          generate_release_notes: true
