name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23' # Use recent go version

      - name: Build Windows Binary
        run: GOOS=windows GOARCH=amd64 go build -o transend.exe cmd/transend/main.go

      - name: Build Linux Binary
        run: GOOS=linux GOARCH=amd64 go build -o transend-linux cmd/transend/main.go

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            transend.exe
            transend-linux
          draft: false
          prerelease: false
          generate_release_notes: true
