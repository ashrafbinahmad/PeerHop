[package]
name = "peerhop"
version = "3.0.0"
edition = "2024"
description = "Fast local file transfer between devices on the same network"
authors = ["Muhammed Asraf"]
license = "ISC"
build = "build.rs"

[[bin]]
name = "PeerHop"
path = "src/main.rs"

[[bin]]
name = "ShareShim"
path = "src/bin/share-shim.rs"

[[bin]]
name = "peerhop-cli"
path = "src/bin/peerhop-cli.rs"

[dependencies]
# GUI
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }

egui-phosphor = "0.14.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
qrcode = { version = "0.14.1", default-features = false }
rfd = "0.17.2"
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }
notify-rust = "4.18.2"
open = "5.4.5"
sys-locale = "0.3.2"

# Server
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "time", "signal"] }
tokio-util = { version = "0.7.20", features = ["io"] }
axum = { version = "0.8.9", features = ["ws", "multipart"] }
futures-util = "0.3.34"
rust-embed = "8.13.0"
mime_guess = "2.0.5"

# Core
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4.45", features = ["serde"] }
parking_lot = "0.13.0"
rand = "0.10.3"
if-addrs = "0.15.0"
zip = { version = "9.4.0", default-features = false, features = ["deflate"] }

# CLI
indicatif = "0.18.6"
str0m = { version = "0.25", default-features = false, features = ["rust-crypto"] }
k256 = { version = "0.14.0", features = ["schnorr"] }
aes-gcm = "0.11.1"
hkdf = "0.13.0"
sha2 = "0.11.1"
hex = "0.4.3"
base64 = "0.23.1"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "3.5.1", default-features = false, features = ["rustls", "json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# WinRT Share Target activation, used only by ShareShim.
windows = { version = "0.62", features = [
    "ApplicationModel_Activation",
    "ApplicationModel_DataTransfer_ShareTarget",
    "Foundation_Collections",
    "Storage",
    "Win32_System_WinRT",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[workspace]
# Release tooling (`cargo msix`, see .cargo/config.toml); not part of the app.
members = ["xtask"]
